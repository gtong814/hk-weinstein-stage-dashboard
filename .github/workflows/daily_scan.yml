name: Run HK Stan Weinstein Stage Scanner

on:
  schedule:
    # 避開 :00/:15/:30/:45 高峰，設雙重保險（HKT 16:37 及 17:17，避免收市數據延遲）
    - cron: '37 8 * * 1-5'
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk-weinstein-daily-scan
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: 'Asia/Hong_Kong'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check HKEX trading day
        id: check_trading_day
        run: |
          python - << 'EOF'
          import os
          import exchange_calendars as xcals
          import pandas as pd

          hkex = xcals.get_calendar('XHKG')
          today_hk = pd.Timestamp.now(tz='Asia/Hong_Kong').strftime('%Y-%m-%d')
          is_open = hkex.is_session(today_hk)
          print(f'Date (HKT): {today_hk}, HKEX Open: {is_open}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'is_open={str(is_open).lower()}\n')
          EOF

      - name: Run HK Stan Weinstein Stage Scanner
        if: steps.check_trading_day.outputs.is_open == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python scanner.py

      - name: Commit and push updated scan results
        if: steps.check_trading_day.outputs.is_open == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in scan_results.json data.json hk_connect_universe.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Skipping missing file: $f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scan): update HK Stock Connect Weinstein scan ($(date +'%Y-%m-%d %H:%M HKT'))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
